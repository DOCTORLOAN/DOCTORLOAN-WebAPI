  # Job 7: Create GitHub Issues (chạy sau khi tất cả jobs khác hoàn thành)
  create-issues:
    name: Create GitHub Issues
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, performance-analysis, api-validation, api-endpoint-testing]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-logs'
          merge-multiple: false
          path: artifacts

      - name: Setup GitHub CLI
        run: |
          type gh >/dev/null 2>&1 || { echo "GitHub CLI not installed, installing..."; sudo apt-get update && sudo apt-get install -y gh; }
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip jq || true

      - name: Create Security Issues
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "artifacts/security-logs/security-findings.json" ]; then
            echo "Processing security findings..."
            # Placeholder: Add script to create issues from security findings
            echo "Security issues creation script needed"
          else
            echo "No security issues to create"
          fi

      - name: Create Performance Issues
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "artifacts/performance-logs/performance-findings.json" ]; then
            echo "Processing performance findings..."
            # Placeholder: Add script to create issues from performance findings
            echo "Performance issues creation script needed"
          else
            echo "No performance issues to create"
          fi

  # Job 8: Generate Final Report
  generate-report:
    name: Generate Quality Report
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, performance-analysis, api-validation, api-endpoint-testing]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-logs'
          merge-multiple: false
          path: artifacts

      - name: Generate Summary Report
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 📊 Comprehensive Code Quality & API Validation Report
          
          ## 🔍 Code Quality
          EOF
          
          if [ -f "artifacts/code-quality-logs/build-output.txt" ]; then
            ERRORS=$(grep -iE "error\s+[A-Z]{2}[0-9]{4}" artifacts/code-quality-logs/build-output.txt | wc -l || echo "0")
            WARNINGS=$(grep -iE "warning\s+[A-Z]{2}[0-9]{4}" artifacts/code-quality-logs/build-output.txt | wc -l || echo "0")
            echo "- **Build Errors:** $ERRORS" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Warnings:** $WARNINGS" >> $GITHUB_STEP_SUMMARY
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          
          ## 🔒 Security Analysis
          EOF
          
          if [ -f "artifacts/security-logs/security-findings.json" ]; then
            SECURITY_ISSUES=$(jq 'length' artifacts/security-logs/security-findings.json || echo "0")
            CRITICAL=$(jq '[.[] | select(.severity == "critical")] | length' artifacts/security-logs/security-findings.json || echo "0")
            HIGH=$(jq '[.[] | select(.severity == "high")] | length' artifacts/security-logs/security-findings.json || echo "0")
            echo "- **Total Security Issues:** $SECURITY_ISSUES" >> $GITHUB_STEP_SUMMARY
            echo "- **Critical:** $CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- **High:** $HIGH" >> $GITHUB_STEP_SUMMARY
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          
          ## ⚡ Performance Analysis
          EOF
          
          if [ -f "artifacts/performance-logs/performance-findings.json" ]; then
            PERF_ISSUES=$(jq 'length' artifacts/performance-logs/performance-findings.json || echo "0")
            echo "- **Total Performance Issues:** $PERF_ISSUES" >> $GITHUB_STEP_SUMMARY
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          
          ## 🔌 API Validation
          EOF
          
          if [ -f "artifacts/api-documentation/openapi-validation.txt" ]; then
            if grep -q "is valid" artifacts/api-documentation/openapi-validation.txt; then
              echo "- **OpenAPI Specification:** ✅ Valid" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **OpenAPI Specification:** ❌ Invalid" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- **OpenAPI Specification:** ⚠️ Not generated" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "artifacts/api-documentation/api-validation-report.json" ]; then
            TOTAL_ENDPOINTS=$(jq -r '.total_endpoints' artifacts/api-documentation/api-validation-report.json || echo "0")
            ENDPOINTS_WITH_DOCS=$(jq -r '.endpoints_with_docs' artifacts/api-documentation/api-validation-report.json || echo "0")
            MISSING_RESPONSES=$(jq -r '.missing_responses' artifacts/api-documentation/api-validation-report.json || echo "0")
            CONFIG_VALID=$(jq -r '.config_valid' artifacts/api-documentation/api-validation-report.json || echo "false")
            SECURITY_HEADERS=$(jq -r '.security_headers' artifacts/api-documentation/api-validation-report.json || echo "false")
            HEALTH_CHECKS=$(jq -r '.health_checks_registered' artifacts/api-documentation/api-validation-report.json || echo "false")
            
            echo "- **Total API Endpoints:** $TOTAL_ENDPOINTS" >> $GITHUB_STEP_SUMMARY
            echo "- **Endpoints with Documentation:** $ENDPOINTS_WITH_DOCS" >> $GITHUB_STEP_SUMMARY
            echo "- **Missing Response Schemas:** $MISSING_RESPONSES" >> $GITHUB_STEP_SUMMARY
            echo "- **API Configuration:** $([ "$CONFIG_VALID" = "true" ] && echo "✅ Valid" || echo "⚠️ Issues found")" >> $GITHUB_STEP_SUMMARY
            echo "- **Security Headers:** $([ "$SECURITY_HEADERS" = "true" ] && echo "✅ Configured" || echo "⚠️ Not found")" >> $GITHUB_STEP_SUMMARY
            echo "- **Health Checks:** $([ "$HEALTH_CHECKS" = "true" ] && echo "✅ Registered" || echo "⚠️ Not found")" >> $GITHUB_STEP_SUMMARY
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          
          ---
          *Report generated automatically by CI Pipeline*
          EOF

      - name: Fail on Critical Issues
        if: always() && needs.code-quality.result != 'success'
        run: |
          echo "❌ Build failed. Please review and fix errors."
          exit 1

